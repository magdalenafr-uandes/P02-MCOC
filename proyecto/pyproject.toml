[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplan"
version = "0.2.0"
description = "Capstone P02-MCOC: fundación, solver térmico 1D/2D/3D e IFC (Grupo 1)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Grupo 1 — P2 MCOC" }]
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "ifcopenshell>=0.9,<0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
