# Caso base E07/E08: fundación de 5 vertidas (geometry/foundation.ifc) en el
# sitio oficial del curso (configs/site.yaml: Parque Eólico Wayra, Taltal).
#
# Todo parámetro del caso vive aquí, nunca en el solver. Se puede cambiar sin
# editar este archivo con --set, por ejemplo:
#   python scripts/pipeline_e07.py --set malla.paso_m=0.2 --set vertidas.2.inicio_h=12
#
# Prioridad por vertida: vertidas.<id>  >  vertidas.defecto  >  pset del IFC
# (Inicio_h, TemperaturaColocacion_C, TipoHormigon, RetiroMoldaje_h).
#
# Origen de cada dato:
#   [repo]     dato del repositorio o de las guías del curso.
#   [SUPUESTO] valor provisional sin dato del proyecto: reemplazar cuando exista.

#
# ─── CAMBIOS RÁPIDOS (lo que puede pedir el profesor) ─────────────────────────
# Desde proyecto/:  .venv\Scripts\python.exe scripts\comparar_e08.py --variante CLAVE=VALOR
# (base vs. variante en una figura) o scripts\pipeline_e07.py --set CLAVE=VALOR.
# Modo rápido (~12 s): agregar --set malla.paso_m=0.5 --set simulacion.duracion_h=72
#
#   Material del hormigón ....... hormigones.M1.k_W_mK=2.5   (también rho_kg_m3, cp_J_kgK)
#   Calor de hidratación (curva). hormigones.M1.hidratacion.curva=M3_SS   (media | M1_SS ... M4_22A)
#   T de colocación (todas) ..... vertidas.defecto.T_colocacion_C=12
#   T de colocación (una) ....... vertidas.3.T_colocacion_C=12
#   Hora de inicio de una vertida vertidas.3.inicio_h=20
#   Ocultar una vertida ......... vertidas.5.visible=false
#   Aislación superior .......... vertidas.defecto.R_superior_m2K_W=1.25
#                                 R = espesor / k  ->  50 mm con k = 0.04 W/mK: 0.05/0.04 = 1.25
#   Moldaje lateral ............. vertidas.defecto.R_lateral_m2K_W=0.12  (18 mm madera k≈0.15)
#   Retiro del moldaje .......... vertidas.defecto.retiro_moldaje_h=48
#   Material del suelo .......... suelo.k_W_mK=1.8   (rho_kg_m3, cp_J_kgK, T_inicial_C)
#   Espesor de suelo modelado ... suelo.espesor_m=4.0   (0 = sin suelo)
#   T del suelo profundo ........ base.T_C=18   o   base.tipo=adiabatico
#   Ambiente constante (sin clima) --set clima=null --set "ambiente={T_C: 25, h_W_m2K: 10}"
#   Malla ....................... malla.paso_m=0.2  malla.paso_z_m=0.05
#   Duración .................... simulacion.duracion_h=168
#   Criterios ................... criterios.T_max_C=70  criterios.delta_T_C=20
#
#   Espesor / geometría de la FUNDACIÓN: no está aquí; está en el IFC
#   (geometry/foundation.ifc). Ver proyecto/MAPA_DEL_CODIGO.md, sección 3.

ifc: ../geometry/foundation.ifc   # relativo a este archivo

malla:
  paso_m: 0.25            # Δx = Δy; convergencia: ±0.2 °C en T_max, ~1 °C en ΔT
  paso_z_m: 0.05          # Δz: divide 0.55, 1.10 y 1.00 m => interfaces exactas (error por vertida < 1 %
                          #     en vez de 9-16 % con Δz = 0.25). Omitirlo = voxel cúbico.
  margen_lateral_m: 2.0   # aire y suelo alrededor (>= paso); 2 m > 2·√(α_suelo·14 d) ≈ 1.7 m
  margen_superior_m: 0.5  # aire sobre el pedestal (>= paso)
  corregir_area: true     # convección con el área real: la escalera la sobrestima ~30 % y no converge

simulacion:
  inicio: "2026-11-27T04:00"   # [repo] 27-nov (rúbrica E10); la hora 04:00 es [SUPUESTO] (ejemplo de G08)
  duracion_h: 336         # [repo] 14 días: los criterios se evalúan sobre los máximos de 14 días
  fraccion_dt: 0.8        # dt = 0.8 · límite monótono C/ΣG
  dt_max_h: 0.5           # tope por precisión de la cinética de hidratación
  guardar_cada_h: 1

criterios:                # [repo] docs/hoja_de_ruta.md (docentes, no normativos)
  T_max_C: 70.0
  delta_T_C: 20.0
  profundidad_superficie_m: 0.025   # "superficie" a ~25 mm bajo la cara exterior

clima:                    # [repo] snapshots de Open-Meteo del sitio oficial (G07); ver scripts/listar_clima.py
  # Pronóstico más reciente. Se reemplaza por uno nuevo (nunca se sobrescribe) a medida
  # que se acerca el 27-nov; a menos de ~16 días empieza a cubrir la ventana de la obra.
  snapshot: ../data/weather/2026-11-07T2001_pronostico
  completar: respaldo     # error | repetir_ultimo_dia | respaldo (cola que el pronóstico no cubre)
  respaldo:               # [SUPUESTO] decisión del equipo (G07): reanálisis ERA5 de las mismas fechas de 2025
    snapshot: ../data/weather/2026-10-31T1807_historico
    desplazar_anios: 1

ambiente:
  # Cada mecanismo una sola vez: convección (h_c), onda larga (h_r, emisividad) y sol (α·G).
  conveccion_viento:
    a_W_m2K: 2.8           # Watmuff et al. (1977): h_c = 2,8 + 3,0·v, SOLO convección.
    b_J_m3K: 3.0           #   (McAdams 5,7 + 3,8·v ya incluye radiación: con emisividad > 0 la contaría dos veces)
    incluye_radiacion: false
    altura_medicion_m: 10.0     # Open-Meteo: wind_speed_10m
    altura_superficie_m: 2.0    # viento junto a la fundación (perfil logarítmico: ×0,72)
    rugosidad_m: 0.03           # [SUPUESTO] terreno abierto / desierto
  absortividad_solar: 0.65     # [SUPUESTO] hormigón gris / moldaje de madera
  emisividad: 0.9              # [SUPUESTO] hormigón
  factor_solar_lateral: 0.0    # [SUPUESTO] sin sol en caras verticales: conservador para ΔT
  # Sin 'clima': T_C y h_W_m2K constantes, o 'serie' [[t_h, T_C], ...].

protecciones:             # catálogo: R = espesor / k [m²K/W] (moldaje, aislación)
  madera_18mm: {espesor_m: 0.018, k_W_mK: 0.15}         # [SUPUESTO] R = 0,12
  manta_50mm: {espesor_m: 0.050, k_W_mK: 0.04}          # [SUPUESTO] R = 1,25
  poliestireno_100mm: {espesor_m: 0.100, k_W_mK: 0.035} # [SUPUESTO] R = 2,86

base:                     # cara inferior de la caja (bajo el suelo)
  tipo: dirichlet         # dirichlet | adiabatico
  T_C: 16.6               # [SUPUESTO] T media del aire en el período (suelo profundo ≈ media anual)

suelo:                    # espesor_m: 0 => sin suelo (la base actúa bajo el hormigón)
  espesor_m: 3.0          # con 1 m la base Dirichlet extrae 7.5 GJ artificiales en 14 d; con 3 m ≈ 0
  k_W_mK: 1.39            # [repo] Ju y Lei (2019), guía §31
  rho_kg_m3: 1800
  cp_J_kgK: 1273
  T_inicial_C: 16.6       # [SUPUESTO] igual que la base

hormigones:
  M1:
    k_W_mK: 2.22          # [repo] Ju y Lei (2019), guía §31
    rho_kg_m3: 2400
    cp_J_kgK: 970
    hidratacion:          # [repo] fuente de calor MEDIDA entregada por el profesor (correo 12-nov-2026)
      modelo: fuente_Q     # Q(t) [W/m³] del archivo -> θ(t) = ∫Q dt/(ρ cp)  (MAPA:fuente-medida)
      archivo: ../data/hidratacion/source_terms.txt   # 8 probetas: M1..M4 × campañas SS y 22A
      curva: media         # media de las 8 | M1_SS M2_SS M3_SS M4_SS M1_22A M2_22A M3_22A M4_22A
                           # θ total: media 124 K; rango 82 K (M4_22A) a 164 K (M3_SS)
      paso_h: 0.25         # resolución de la tabla θ(t) generada
      Ea_J_mol: 40000      # [SUPUESTO] energía de activación (Arrhenius); 0 = sin efecto de T
      T_ref_C: 20.0        # [SUPUESTO] probetas chicas ~ a T de laboratorio: la curva se lee a T_ref
      # Curva pedagógica anterior (guía §24), para comparar:
      # modelo: exponencial    # exponencial: θ∞(1-e^(-te/τ)) | schindler: θ∞·exp(-(τ/te)^β) | tabla
      # theta_inf_C: 45.0      # o bien cemento_kg_m3, calor_cemento_J_kg, grado_hidratacion_ultimo
      # tau_h: 30.0

vertidas:
  # [repo] inicio (0, 6, 12, 18, 24 h), T_colocación (18 °C) y retiro de moldaje (72 h) salen del IFC.
  defecto:
    visible: true              # false = la vertida no se incluye en la grilla
    moldaje: madera_18mm       # [SUPUESTO] caras laterales e inferiores hasta retiro_moldaje_h (IFC: 72 h)
    R_superior_m2K_W: 0.0      # [SUPUESTO] cara superior descubierta (sin aislación)
    # Aislación (opcional), con su propio período; "desmolde" = empieza al retirar el moldaje:
    # aislacion: manta_50mm
    # aislacion_caras: [superior, lateral]
    # aislacion_desde_h: desmolde      # o un número de horas desde el inicio de la vertida
    # aislacion_hasta_h: 336
  # 2:
  #   inicio_h: 12             # sobrescribe Inicio_h del IFC
  #   inicio: "2026-11-27T16:00"   # o con fecha-hora (requiere simulacion.inicio)
  #   T_colocacion_C: 14
