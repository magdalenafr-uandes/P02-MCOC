name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar el paquete (editable) con dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ejecutar las pruebas
        run: python -m pytest -q

      - name: Verificar la CLI con la configuración oficial
        run: mcplan info --site configs/site.yaml

  test-e01:
    name: Pruebas E01 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: E01
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar el paquete E01 (editable) con dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ejecutar las pruebas de E01
        run: python -m pytest -q

      - name: Inspeccionar el IFC versionado (edición en Bonsai)
        run: python scripts/inspect_ifc.py
