[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplan"
version = "0.1.0"
description = "Planificación y análisis térmico de vertidas de hormigón masivo — Grupo 1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Grupo 1 — P2 MCOC" }]
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
]

[project.scripts]
mcplan = "mcplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
